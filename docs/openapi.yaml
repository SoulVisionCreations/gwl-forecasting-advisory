openapi: 3.0.3
info:
  title: GWL Groundwater Advisory API
  version: "1.0"
  description: >
    Farmer-facing groundwater crop/water advisory for India. Given a location (lat/lon) and an
    as-of date, returns whether groundwater is set to rise (recharge) or fall (deplete) over the
    next 3 and 6 months versus the local seasonal normal, whether a long-duration crop is workable,
    a confidence level, and a short plain-language message. Served by `advisory.serve_advisory:app`.
    See docs/ADVISORY.md for setup and the env-var reference.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8100
    description: local advisory service (uvicorn advisory.serve_advisory:app)
paths:
  /health:
    get:
      summary: Liveness / readiness
      responses:
        "200":
          description: Service state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  loaded: { type: boolean, example: true }
                  has_6m: { type: boolean, example: true, description: whether the 6-month engine is loaded }
        "503":
          description: Engine not loaded (still starting or misconfigured)
  /advisory:
    post:
      summary: Groundwater crop/water advisory for a point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvisoryRequest"
      responses:
        "200":
          description: Advisory (status ok) or a structured error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisoryResponse"
        "503":
          description: Service not ready
components:
  schemas:
    AdvisoryRequest:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: float, example: 14.71, description: query latitude }
        lon: { type: number, format: float, example: 75.78, description: query longitude }
        date:
          type: string
          format: date
          example: "2025-01-30"
          description: anchor / as-of date (YYYY-MM-DD). Default today; must be today or earlier.
        verbose:
          type: boolean
          default: false
          description: include internal reasoning (full normals, local band, z-spreads, freshness).
    AdvisoryResponse:
      type: object
      description: >
        Always HTTP 200 for a well-formed request. `status=ok` is a full advisory (numbers + a
        two-axis `outlook`). For a future date, no/too-far wells, or missing data the advisory
        DEGRADES GRACEFULLY to `status=insufficient_data` — it returns a machine-stable `reason_code`,
        a `details` object with the numbers behind it, a human `reason`, and a safe farmer `message`,
        with `numbers`/`outlook`/`crop_guidance` null (it never hard-errors on the query).
        `status=error` covers two failure cases: the service not being loaded (HTTP 503), OR an
        UNEXPECTED internal failure on a well-formed request — which is caught and returned as HTTP 200
        with `error.code=internal_error` and a safe farmer `message` (never a raw 500).
        Every field is explained in docs/RESPONSE_FIELDS.md.
      properties:
        status:
          type: string
          enum: [ok, insufficient_data, error]
          example: ok
          description: "ok = full advisory · insufficient_data = graceful fallback (see reason/message) · error = service not ready (503) OR internal_error caught on a valid request (200, safe message)"
        reason:
          type: string
          description: "present when status=insufficient_data — the precise HUMAN-readable technical reason (e.g. 'date … is in the future; must be today or earlier', or 'wells are nearby (23 km) but lack enough history …'). For branching, use reason_code, not this free text."
          example: "wells are nearby (23 km) but lack enough history to form a seasonal normal (usable years: 1)"
        reason_code:
          type: string
          enum: [out_of_network, sparse_history, no_recent_reading, no_seasonal_history, bad_request, forecast_failed]
          description: "present when status=insufficient_data — the MACHINE-stable reason to branch on. out_of_network = no well within 40 km (or none/too few found); sparse_history = wells nearby but too few years for a seasonal normal; no_recent_reading = no live reading anywhere and <2 yr history; no_seasonal_history = analog path found nothing usable; bad_request = usage error (future date / bad location); forecast_failed = unexpected forecaster error."
          example: sparse_history
        details:
          type: object
          description: "present when status=insufficient_data — the concrete numbers behind reason_code (keys vary by code; empty-value keys omitted)."
          properties:
            nearest_km: { type: number, description: "distance to the nearest monitored well (out_of_network / *_history codes)" }
            usable_years: { type: integer, description: "years of usable seasonal history found (*_history codes)" }
            error_code: { type: string, description: "the underlying forecaster error code (bad_request / out_of_network / forecast_failed)" }
          example: { nearest_km: 23.0, usable_years: 1 }
        location:
          type: object
          properties:
            lat: { type: number }
            lon: { type: number }
        anchor_date: { type: string, format: date, example: "2025-01-30" }
        forecast_date: { type: string, format: date, nullable: true, example: "2025-04-30", description: anchor + 3 months (null if insufficient_data) }
        numbers:
          type: object
          description: signed changes in depth-to-water (m). <0 = water table rises (recharge); >0 = falls.
          properties:
            forecast_change_m: { type: number, description: 3-month forecast change }
            forecast_change_m_6m: { type: number, description: 6-month forecast change }
            normal_seasonal_change_m: { type: number, description: "the ~10-yr 3m seasonal normal it's compared to (present only when verbose=true)" }
            normal_seasonal_change_m_6m: { type: number, description: "the 6-month seasonal normal (verbose=true only)" }
        outlook:
          type: object
          description: >
            The two calibrated axes — the heart of the advisory. Each answers a DIFFERENT question and
            carries its OWN test-set reliability (baked constants; no model/service call at runtime).
            Separate from `confidence` (which grades the DATA, not the call).
          properties:
            water_trend:
              type: object
              description: "will the water table rise or fall? (vs ZERO — the model's strongest signal)"
              properties:
                direction: { type: string, enum: [rising, falling], description: "rising = recharge/gain (change_m<0); falling = drawdown/loss" }
                reliability_pct: { type: integer, description: "test-set direction accuracy for a move of this size (~66–88%); rendered as 'about N in 10'" }
            vs_normal:
              type: object
              description: "is that better or worse than a normal year? (vs the seasonal normal ± band)"
              properties:
                level: { type: string, enum: [above, normal, below], description: "above = wetter than usual; below = drier; normal = within band" }
                clarity: { type: string, enum: [clear, moderate, typical], description: "how decisive: clear = well past band (ratio≥2); moderate = just past (1≤ratio<2); typical = within band (level=normal)" }
                reliability_pct: { type: integer, description: "test-set side-accuracy of the above/below call (clear≈74, moderate≈71). Present ONLY for an above/below call (never null)." }
                note: { type: string, description: "present INSTEAD of reliability_pct when level=normal (clarity=typical): 'within the normal band — no above/below call to rate; go by the water-trend read'. No null is returned." }
        last_year:
          type: string
          enum: [wetter, normal, drier]
          description: "last year vs its own normal, in plain words (present ONLY when verbose=true). Replaces the old regime.b; drives the 'Context: last year was …' message line. regime.a is now outlook.vs_normal.level; a_6m is not surfaced (its effect shows in long_crop)."
        long_crop:
          type: object
          properties:
            allowed: { type: boolean, description: "workable only if 3m & 6m at/above normal, water not falling, and the above-call is not marginal" }
            reason: { type: string }
        confidence:
          type: object
          properties:
            level: { type: string, enum: [well-supported, mixed, thin] }
            freshness: { type: string, enum: [good, medium, poor], description: present when verbose=true }
        crop_guidance:
          type: object
          nullable: true
          description: null when status=insufficient_data (no crop guidance is given)
          properties:
            water_need: { type: string, enum: [high, normal, moderate, low] }
            type_examples: { type: array, items: { type: string } }
            rule: { type: string, description: "one-line rationale (water need + duration). Duration itself is on long_crop." }
        message:
          type: string
          description: >
            farmer-facing, number-free message (Gemma-phrased, or a deterministic template). ALWAYS
            present — on insufficient_data it carries a safe "not enough nearby well data … check
            locally (KVK)" fallback.
        error:
          type: object
          description: >
            present ONLY when status=error. Two cases: `init_error` — the service is not loaded
            (HTTP 503); or `internal_error` — an unexpected failure on a well-formed request, caught
            and returned at HTTP 200 with a safe farmer `message` (never a raw 500). Guard/data issues
            (future date, no/far wells, missing data) do NOT use this — they return
            status=insufficient_data + a `reason`, at HTTP 200.
          properties:
            code: { type: string, enum: [init_error, internal_error], example: internal_error }
            message: { type: string }

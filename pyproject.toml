[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwl-forecasting"
version = "0.1.0"
description = "Groundwater level 3-month forecasting — TFT + Prithvi-EO-2.0-300M (LoRA)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Deps PINNED to the trained/serving versions (canonical big-10 venv, Py 3.11) so the published
# forecast numbers reproduce EXACTLY. An unpinned install pulls newer torch/CUDA -> equally valid
# but ~1e-4-different values (GPU float kernels differ across torch 2.12+cu130 vs 2.10+cu128).
# Verified: pinned fresh venv == canonical, byte-for-byte.
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "earthengine-api==1.7.22",
  "rasterio==1.4.4",
  "requests==2.34.2",
  "python-dateutil==2.9.0.post0",
  "timm==1.0.27",
  "einops==0.8.2",
  "peft==0.19.1",
  "transformers==5.12.1",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
  "psycopg2-binary",
  "openmeteo-requests",
  "requests-cache==1.3.3",   # required by inference/acquire/forecast_fetcher.py (Open-Meteo cached session)
  "retry-requests==2.0.0",   # required by forecast_fetcher.py (Open-Meteo retry wrapper)
]

[project.optional-dependencies]
# Only needed to TRAIN / fine-tune or plot (User B); inference does not require these.
# PINNED to canonical: newer mlflow(3.14) rejects the file-store backend, and matplotlib(3.11)
# removed boxplot(labels=) -> both crash the training/plots. These versions match the trained env.
train = ["mlflow==3.11.1", "matplotlib==3.10.8", "seaborn==0.13.2", "tqdm==4.68.3"]
api = ["fastapi==0.135.3", "uvicorn==0.44.0"]

[tool.setuptools.packages.find]
# Ship the two importable packages; training/ and scripts/ are run as scripts, not installed.
include = ["gwlcore*", "inference*"]
